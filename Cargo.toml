[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LGPL-2.0-only"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
sha1 = "0.10"
hex = "0.4"
globset = "0.4"
walkdir = "2"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "signal", "io-util"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
